name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: "pages"
  cancel-in-progress: false

# 릴리스 아티팩트는 여기서 만들지 않는다.
#
# .pkg 서명에는 Developer ID 개인 키가 필요한데, 그 키를 GitHub에 두면
# (시크릿에 넣든 안 넣든) 서명이 GitHub 소유 러너에서 일어나는 동안 키가
# 평문으로 그 VM에 존재하게 된다. GitHub Actions 시크릿은 영지식이 아니라
# 복호화 키를 GitHub이 쥐고 있으므로 "암호화 저장"이 그 사실을 바꾸지 못한다.
#
# 그래서 빌드·서명·공증·릴리스 발행은 전부 로컬에서 한다:
#
#     ./scripts/release.sh v0.4.0-rc1
#
# 이 워크플로는 태그에 맞춰 문서만 배포한다 — 시크릿이 필요 없다.

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: config
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Strip pre-release suffix (e.g. 0.2.0-rc3 → 0.2.0)
          VERSION="${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install mdBook
        run: |
          MDBOOK_VERSION="0.4.40"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Build documentation
        run: mdbook build docs/

      - name: Assemble versioned site
        run: |
          VERSION="${{ steps.config.outputs.version }}"
          mkdir -p build/site

          # Restore existing docs from gh-pages branch
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            # Only restore known files: versions.json, index.html, dev/, and version directories
            # Note: avoid `git show ... > file || true` as the redirect creates an empty file even on failure
            git show origin/gh-pages:versions.json > /tmp/versions.json 2>/dev/null && mv /tmp/versions.json build/site/versions.json || true
            git show origin/gh-pages:index.html > /tmp/index.html 2>/dev/null && mv /tmp/index.html build/site/index.html || true
            git archive origin/gh-pages dev | tar -x -C build/site 2>/dev/null || true
            if [[ -f build/site/versions.json ]] && jq empty build/site/versions.json 2>/dev/null; then
              for v in $(jq -r '.[]' build/site/versions.json); do
                git archive origin/gh-pages "$v" | tar -x -C build/site 2>/dev/null || true
              done
            fi
          fi

          # Add versioned docs
          rm -rf "build/site/${VERSION}"
          mkdir -p "build/site/${VERSION}"
          cp -r build/book/* "build/site/${VERSION}/"

          # Update versions.json
          EXISTING='[]'
          if [[ -f build/site/versions.json ]] && jq empty build/site/versions.json 2>/dev/null; then
            EXISTING=$(cat build/site/versions.json)
          fi
          UPDATED=$(echo "$EXISTING" | jq --arg v "$VERSION" \
            '([$v] + .) | unique | sort_by(split(".") | map(tonumber)) | reverse')
          echo "$UPDATED" > build/site/versions.json

          # Update root redirect
          cp docs/theme/redirect-index.html build/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update version storage
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
